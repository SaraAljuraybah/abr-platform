name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, format, test, build, secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Placeholders only. The build validates their shape; no real project is contacted.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run check:secrets

  # Images pulled from GHCR (authenticated via GITHUB_TOKEN) and cached; anonymous ECR pulls hit
  # rate limits.
  database:
    name: Database (lint, pgTAP, type drift)
    runs-on: ubuntu-24.04
    # Room for the retries (waits of 30s and 90s per retried step).
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # The CLI pulls ghcr.io/supabase/... and skips the pull when the image already exists locally.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      # Also part of the image cache key; bump .github/supabase-images.txt with it.
      SUPABASE_CLI_VERSION: 2.113.0
    steps:
      - name: Record registry pulls
        # Counted by the last step. docker load emits "load" events, not "pull".
        run: |
          nohup docker events --filter type=image --filter event=pull \
            --format '{{.Actor.ID}}' > "$RUNNER_TEMP/docker-pulls.log" 2>&1 &

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Supabase images
        id: images
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: supabase-images-${{ runner.os }}-cli${{ env.SUPABASE_CLI_VERSION }}-ghcr-${{ hashFiles('.github/supabase-images.txt') }}

      - name: Load cached images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/supabase-images.tar"

      - name: Start local database (applies all migrations from zero)
        run: scripts/ci/retry.sh supabase db start

      - name: Lint schema
        run: supabase db lint --level error

      - name: pgTAP tests
        run: scripts/ci/retry.sh supabase test db

      - name: Type drift check
        run: |
          # Generate into a temp file: on failure the CLI writes its error JSON to stdout, which must
          # not be mistaken for drift. retry.sh only passes on the successful attempt's stdout.
          out="$RUNNER_TEMP/database.ts"
          if ! scripts/ci/retry.sh supabase gen types typescript --local > "$out"; then
            echo "::error file=src/types/database.ts::'supabase gen types' failed three times. This is a generation error, not type drift; see the log above."
            exit 1
          fi
          cp "$out" src/types/database.ts
          if ! git diff --quiet -- src/types/database.ts; then
            echo "Generated types differ from the committed file:"
            git --no-pager diff --stat -- src/types/database.ts
            git --no-pager diff -- src/types/database.ts
            echo "::error file=src/types/database.ts::Generated types are out of date. Copy the CI-generated version from the diff above (or run 'npm run db:types') and commit it (the CI-generated version wins; see CLAUDE.md)."
            exit 1
          fi
          echo "src/types/database.ts matches the generated types."

      - name: Export images for the cache
        id: export
        # Cache miss only, and only from pushes (dev and main), so later runs on those branches and
        # pull requests to main can restore it.
        if: steps.images.outputs.cache-hit != 'true' && github.event_name == 'push'
        run: |
          mapfile -t images < <(grep -Ev '^[[:space:]]*(#|$)' .github/supabase-images.txt)
          for image in "${images[@]}"; do
            if ! docker image inspect "$image" > /dev/null 2>&1; then
              echo "::warning file=.github/supabase-images.txt::$image is not in Docker, so the images are not cached this run."
              exit 0
            fi
          done
          docker save -o "$RUNNER_TEMP/supabase-images.tar" "${images[@]}"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save Supabase images
        if: steps.export.outputs.ready == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: supabase-images-${{ runner.os }}-cli${{ env.SUPABASE_CLI_VERSION }}-ghcr-${{ hashFiles('.github/supabase-images.txt') }}

      - name: Check the image list is complete
        # A CLI bump that uses a new image must not leave the cache silently stale.
        run: |
          mapfile -t listed < <(grep -Ev '^[[:space:]]*(#|$)' .github/supabase-images.txt)
          unlisted=0
          while read -r image; do
            if ! printf '%s\n' "${listed[@]}" | grep -qxF "$image"; then
              echo "::error file=.github/supabase-images.txt::Docker has $image, which is not listed. Add it (with the exact tag) so the cache stays complete."
              unlisted=1
            fi
          done < <(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|/)supabase/')
          exit "$unlisted"

      - name: Registry pulls
        if: always()
        run: |
          pulls=$(grep -c . "$RUNNER_TEMP/docker-pulls.log" 2> /dev/null) || true
          if [ "${{ steps.images.outputs.cache-hit }}" = "true" ]; then cache=hit; else cache=miss; fi
          echo "::notice::registry pulls this run: ${pulls:-0} (cache ${cache})"
