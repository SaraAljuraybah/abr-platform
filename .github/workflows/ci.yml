name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, format, test, build, secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only. The build validates their shape; no real project is contacted.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run check:secrets

  database:
    name: Database (lint, pgTAP, type drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local database (applies all migrations from zero)
        run: supabase db start

      - name: Lint schema
        run: supabase db lint --level error

      - name: pgTAP tests
        run: supabase test db

      - name: Type drift check
        run: |
          # Generate into a temp file: on failure the CLI writes its error JSON to stdout,
          # which must not be mistaken for drift. Retry, since generation fails intermittently.
          out="$RUNNER_TEMP/database.ts"
          for attempt in 1 2 3; do
            if supabase gen types typescript --local > "$out" 2> "$RUNNER_TEMP/gen.err"; then
              break
            fi
            echo "Type generation failed (attempt $attempt):"
            cat "$out" "$RUNNER_TEMP/gen.err"
            if [ "$attempt" = 3 ]; then
              echo "::error file=src/types/database.ts::'supabase gen types' failed three times. This is a generation error, not type drift; see the log above."
              exit 1
            fi
            sleep 10
          done
          cp "$out" src/types/database.ts
          if ! git diff --quiet -- src/types/database.ts; then
            echo "Generated types differ from the committed file:"
            git --no-pager diff --stat -- src/types/database.ts
            git --no-pager diff -- src/types/database.ts
            echo "::error file=src/types/database.ts::Generated types are out of date. Copy the CI-generated version from the diff above (or run 'npm run db:types') and commit it (the CI-generated version wins; see CLAUDE.md)."
            exit 1
          fi
          echo "src/types/database.ts matches the generated types."
