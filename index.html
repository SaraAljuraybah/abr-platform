<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/abr-symbol.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF9FC" />
    <!-- Defaults (English). src/lib/i18n.ts updates title and description per language. -->
    <title>ABR · Graduation projects, verified and connected</title>
    <meta
      name="description"
      content="ABR connects verified students with the organizations and mentors who can take their work further. Every project is reviewed, and contact details are shared only when both sides agree."
    />
    <!-- Open Graph (static). No og:image until a social image is approved. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ABR" />
    <meta property="og:url" content="https://tryabr.com/" />
    <meta property="og:title" content="ABR · Graduation projects, verified and connected" />
    <meta
      property="og:description"
      content="ABR connects verified students with the organizations and mentors who can take their work further. Every project is reviewed, and contact details are shared only when both sides agree."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set language and direction before first paint to avoid a flash of the wrong layout.
      // Must stay in sync with LANGUAGE_STORAGE_KEY in src/lib/i18n.ts.
      (function () {
        try {
          if (localStorage.getItem('abr.lang') === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
